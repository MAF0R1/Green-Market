{% extends 'base.html' %}

{% block title %}Оформление заказа{% endblock %}

{% block content %}
<div class="checkout-wrapper" style="max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
    <h2 style="text-align: center; color: #2563eb;">💳 Оформление заказа</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 50px; font-size: 18px; cursor: pointer; margin-top: 20px;">
            Оплатить заказ
        </button>
    </form>
</div>
{% endblock %}
